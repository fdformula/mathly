<script type="text/javascript">
function displaytext() { return ""; } // to be overwritten
function displaytitle() { return "<font size=4>Polar curve: <em>r</em>(<em>&theta;</em>) = sec(acos(sin(<em>n&theta;</em>))/<em>n</em>)</font>"; }
var x = [], t = [], X, Y, T, p, mthlyGlobal = [], mthlyGlobal1 = [], mthlyGlobal2 = [], mthlyGlobal3 = [], mthlyGlobal4 = [], mthlyGlobal5 = [];
function mthlynNext(x) {

	}
	x = Math.round(x * 1000) / 1000;

for (let i = 0; i <= p * (6.3 + 0) - 0; i += 0.0126) { t.push(i); }

var mthlyTraces = [];

function mthlyUpdateTraces() {
	mthlyTraces = [];
	mthlyTraces.push({ x: t.map(t => (1 / Math.cos(Math.acos(Math.sin(n*t))/n)) * Math.cos(t)), y: t.map(t => (1 / Math.cos(Math.acos(Math.sin(n*t))/n)) * Math.sin(t)), mode: 'lines', line: { simplify: false }, fill: 'toself' });
