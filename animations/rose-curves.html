<button type="button" title="Previous value" onclick="mthlydNext(-1)" style="width:48px;left:348px;top:90px;position:absolute">Prev</button>
<button type="button" title="Next value" onclick="mthlydNext(1)" style="width:48px;left:399px;top:90px;position:absolute">Next</button>
<label for="mthlySldrd" style='top:90px;'>d:</label>
<input type="range" id="mthlySldrd" min="1" max="10" value="1" style='left:72px;top:90px;' step="0.5"></input><span id="mthlySldrdvalue" style="left:293px;top:90px;position:absolute">&nbsp;</span>
<span id="displaytext" style="left:74px;top:120px;position:absolute">&nbsp;</span>
<script type="text/javascript">
function displaytext() { return ""; } // to be overwritten
function displaytitle() { return ""; }
var x = [], t = [], X, Y, T, p, mthlyGlobal = [], mthlyGlobal1 = [], mthlyGlobal2 = [], mthlyGlobal3 = [], mthlyGlobal4 = [], mthlyGlobal5 = [];
function mthlynNext(x) {
  x = n + x*mthlynStep;
  if (x < mthlynMin) {
    x = mthlynMax;
  } else if (x > mthlynMax) {
    x = mthlynMin;
  }
  x = Math.round(x * 1000) / 1000;
  mthlySldrn.value = x;
  document.getElementById("mthlySldrnvalue").innerHTML = x;
}
function mthlydNext(x) {
  x = d + x*mthlydStep;
  if (x < mthlydMin) {
    x = mthlydMax;
  } else if (x > mthlydMax) {
    x = mthlydMin;
  }
  x = Math.round(x * 1000) / 1000;
  mthlySldrd.value = x;
  document.getElementById("mthlySldrdvalue").innerHTML = x;
}

const mthlyLayout = {
  xaxis: { range: [-1.2, 1.2]}, // plot with fixed axes
  yaxis: { range: [-1.2, 1.2], scaleanchor: 'x', scaleratio: 1 },
  showlegend: false
};

var mthlySldrn = document.getElementById('mthlySldrn');
var mthlySldrd = document.getElementById('mthlySldrd');
mthlySldrn.value = 3.5;
var n = 3.5;
mthlySldrd.value = 2;
var d = 2;
p = 1;
for (let i = 0; i <= p * (125.66370614359172 + 0) - 0; i += 0.025132741228718346) { t.push(i); }

var mthlyTraces = [];
const mthlyxMin = -1.2, mthlyxMax = 1.2, mthlyxStep = 1;
const mthlyyMin = -1.2, mthlyyMax = 1.2;
const mthlytMin = 0, mthlytMax = 125.66370614359172, mthlytStep = 0.01;
const mthlynMin = 1, mthlynMax = 10, mthlynStep = 0.5;
const mthlydMin = 1, mthlydMax = 10, mthlydStep = 0.5;

function mthlyUpdateTraces() {
  mthlyTraces = [];

  // vvvvv user's javascript vvvvv
function displaytitle() {
  return "<font size=5>Rose curves: polar function r(<i>&theta;</i>) = cos(<i>n/d &bull; &theta;</i>)</font>"
}
function displaytext() {
  return "See: <a href=https://iviveros.github.io/param-eq/ target=_blank>https://iviveros.github.io/param-eq/</a>"
}
  // ^^^^^ user's javascript ^^^^^

  mthlyTraces.push({ x: t.map(t => Math.cos(n/d*t)*Math.cos(t)), y: t.map(t => Math.cos(n/d*t)*Math.sin(t)), mode: 'lines', line: { simplify: false }, fill: 'none' });
  document.getElementById("displaytext").innerHTML = displaytext();
  document.getElementById("title").innerHTML = displaytitle();
}

mthlyUpdateTraces();
const mthlyInitData = mthlyTraces;

var mthlyNewCs = [], mthlyOldCs = [99999999, 99999999];

function mthlyAnimatePlot() {
  n = Number(mthlySldrn.value);
  d = Number(mthlySldrd.value);
  // has any controls changed?
  mthlyNewCs = [n, d];
  var unchangedq = true;
  for (let i = 0; i < 2; i++) {
    if (Math.abs(mthlyOldCs[i] - mthlyNewCs[i]) > 0.00001) {
      unchangedq = false; break;
    }
  }
  if (unchangedq) { return; }
  mthlyOldCs = [n, d]; // update values of controls
  mthlyUpdateTraces();
  Plotly.animate('mathlyDiv', {
    data: mthlyTraces,
    traces: mthlyTraces.keys() // update all traces
  }, {
    transition: { duration: 0 },
    frame: { duration: 0 }
  });
}

document.getElementById("mthlySldrnvalue").innerHTML = mthlySldrn.value;
mthlySldrn.addEventListener("input", function() { document.getElementById("mthlySldrnvalue").innerHTML = mthlySldrn.value; });
document.getElementById("mthlySldrdvalue").innerHTML = mthlySldrd.value;
mthlySldrd.addEventListener("input", function() { document.getElementById("mthlySldrdvalue").innerHTML = mthlySldrd.value; });

Plotly.newPlot('mathlyDiv', mthlyInitData, mthlyLayout);
mthlyAnimatePlot();
mthlyIntervalId = setInterval(mthlyAnimatePlot, 200); // animate every 0.2 seconds
</script>
