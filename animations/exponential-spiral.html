<html>
<head>
<meta charset="utf-8">
<title>MathLua Function Animation</title>
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<style>
label {
	display: inline-block;
	width: 10px;
	left: 50px;
	text-align: left;
	vertical-align: middle;
	position: absolute;
	white-space: nowrap;
}

}

</head>
<body>
<div id="mathlyDiv" style="width:600px;height:600px;display:inline-block;top:50px;position:absolute;"></div>
<span id='title' style="width:600px;left:0px;display:block;text-align:center;">&nbsp;</span>
<!-- controls -->
<button type="button" title="Previous value" onclick="mthlykNext(-1)" style="width:48px;left:348px;top:60px;position:absolute">Prev</button>
<button type="button" title="Next value" onclick="mthlykNext(1)" style="width:48px;left:399px;top:60px;position:absolute">Next</button>
<label for="mthlySldrk" style='top:60px;'>k:</label>
<input type="range" id="mthlySldrk" min="1" max="20" value="1" style='left:72px;top:60px;' step="1"></input><span id="mthlySldrkvalue" style="left:293px;top:60px;position:absolute">&nbsp;</span>
<button type="button" title="Previous value" onclick="mthlymNext(-1)" style="width:48px;left:348px;top:90px;position:absolute">Prev</button>
<button type="button" title="Next value" onclick="mthlymNext(1)" style="width:48px;left:399px;top:90px;position:absolute">Next</button>
<label for="mthlySldrm" style='top:90px;'>m:</label>
<input type="range" id="mthlySldrm" min="-4" max="-0.1" value="-4" style='left:72px;top:90px;' step="0.1"></input><span id="mthlySldrmvalue" style="left:293px;top:90px;position:absolute">&nbsp;</span>
<span id="displaytext" style="left:74px;top:120px;position:absolute">&nbsp;</span>
<script type="text/javascript">
function displaytext() { return ""; } // to be overwritten
function displaytitle() { return "<font size=4>Exponential spiral: <em>x</em>(<em>t</em>) = sin(<em>kt</em>) <em>e<sup>mt</sup></em>, <em>y</em>(<em>t</em>) = cos(<em>kt</em>) <em>e<sup>mt</sup></em></font>"; }
var x = [], t = [], X, Y, T, p, mthlyGlobal = [], mthlyGlobal1 = [], mthlyGlobal2 = [], mthlyGlobal3 = [], mthlyGlobal4 = [], mthlyGlobal5 = [];
function mthlykNext(x) {
	x = k + x*mthlykStep;
	if (x < mthlykMin) {
		x = mthlykMax;
	} else if (x > mthlykMax) {
		x = mthlykMin;
	}
	x = Math.round(x * 1000) / 1000;
	mthlySldrk.value = x;
	document.getElementById("mthlySldrkvalue").innerHTML = x;
}
function mthlymNext(x) {
	x = m + x*mthlymStep;
	if (x < mthlymMin) {
		x = mthlymMax;
	} else if (x > mthlymMax) {
		x = mthlymMin;
	}
	x = Math.round(x * 1000) / 1000;
	mthlySldrm.value = x;
	document.getElementById("mthlySldrmvalue").innerHTML = x;
}

const mthlyLayout = {
	xaxis: { range: [-1.2, 1.2], visible: false}, // plot with fixed axes
	yaxis: { range: [-1.2, 1.2], visible: false, scaleanchor: 'x', scaleratio: 1	},
	showlegend: false
};

var mthlySldrk = document.getElementById('mthlySldrk');
var mthlySldrm = document.getElementById('mthlySldrm');
mthlySldrk.value = 6;
var k = 6;
mthlySldrm.value = -1.1;
var m = -1.1;
p = 1;
for (let i = 0; i <= p * (6.2831853071795862 + 0) - 0; i += 0.0020943951023931952) { t.push(i); }

var mthlyTraces = [];
const mthlyxMin = -1.2, mthlyxMax = 1.2, mthlyxStep = 1;
const mthlyyMin = -1.2, mthlyyMax = 1.2;
const mthlytMin = 0, mthlytMax = 6.2831853071795862, mthlytStep = 0.01;
const mthlykMin = 1, mthlykMax = 20, mthlykStep = 1;
const mthlymMin = -4, mthlymMax = -0.1, mthlymStep = 0.1;

function mthlyUpdateTraces() {
	mthlyTraces = [];
	mthlyTraces.push({ x: t.map(t => Math.sin(k*t)*Math.exp(m*t)), y: t.map(t => Math.cos(k*t)*Math.exp(m*t)), mode: 'lines', line: { simplify: false }, fill: 'none' });
	document.getElementById("displaytext").innerHTML = displaytext();
	document.getElementById("title").innerHTML = displaytitle();
}

mthlyUpdateTraces();
const mthlyInitData = mthlyTraces;

var mthlyNewCs = [], mthlyOldCs = [99999999, 99999999];

function mthlyAnimatePlot() {
	k = Number(mthlySldrk.value);
	m = Number(mthlySldrm.value);
	// has any controls changed?
	mthlyNewCs = [k, m];
	var unchangedq = true;
	for (let i = 0; i < 2; i++) {
		if (Math.abs(mthlyOldCs[i] - mthlyNewCs[i]) > 0.00001) {
			unchangedq = false; break;
		}
	}
	if (unchangedq) { return; }
	mthlyOldCs = [k, m]; // update values of controls
	mthlyUpdateTraces();
	Plotly.animate('mathlyDiv', {
		data: mthlyTraces,
		traces: mthlyTraces.keys() // update all traces
	}, {
		transition: { duration: 0 },
		frame: { duration: 0 }
	});
}

document.getElementById("mthlySldrkvalue").innerHTML = mthlySldrk.value;
mthlySldrk.addEventListener("input", function() { document.getElementById("mthlySldrkvalue").innerHTML = mthlySldrk.value; });
document.getElementById("mthlySldrmvalue").innerHTML = mthlySldrm.value;
mthlySldrm.addEventListener("input", function() { document.getElementById("mthlySldrmvalue").innerHTML = mthlySldrm.value; });

Plotly.newPlot('mathlyDiv', mthlyInitData, mthlyLayout);
mthlyAnimatePlot();
mthlyIntervalId = setInterval(mthlyAnimatePlot, 200); // animate every 0.2 seconds
</script>
</body>
</html>
